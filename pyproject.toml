[project]
name = "phonotrainer"
version = "0.1.0"
description = "Phonetic analyzer for native English speech: real vs canonical phones + connected-speech phenomena + prosody"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Pineda" }]
keywords = [
    "phonetics", "connected-speech", "pronunciation", "forced-alignment",
    "speech-recognition", "wav2vec2", "whisper", "ipa", "prosody", "linguistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "torch",
    "torchaudio",
    "phonemizer>=3.2",
    "g2p-en>=2.1",
    "panphon>=0.20",
    "praat-parselmouth>=0.4",
    "numpy",
    "soundfile",
    "click",
    "rich",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/mapineda48/phonotrainer"
Repository = "https://github.com/mapineda48/phonotrainer"
Issues = "https://github.com/mapineda48/phonotrainer/issues"

[project.scripts]
phonotrainer = "phonotrainer.cli:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639: license as an SPDX expression + license-files
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phonotrainer"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` tries to collect the repos cloned into references/.
testpaths = ["tests"]
markers = ["slow: slow tests (full vocabulary coverage, models)"]
