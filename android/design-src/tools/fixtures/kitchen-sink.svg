<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="160" viewBox="-10 -10 200 160">
  <title>svg2vd fixture: every supported feature at once</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="100%" style="stop-color:#d8ccb2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="paper-skewed" xlink:href="#paper" x1="0" y1="0" x2="1" y2="1"/>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1b1a18" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1b1a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="180" y2="120" spreadMethod="reflect" gradientTransform="scale(0.5 1)">
      <stop offset="0" stop-color="#45433e"/>
      <stop offset="1" stop-color="#efebe2"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="150" cy="40" r="28"/></clipPath>
  </defs>
  <rect x="-10" y="-10" width="200" height="160" fill="url(#paper)"/>
  <g transform="translate(20 20) rotate(-8 30 30)">
    <rect x="0" y="0" width="60" height="44" rx="8" ry="6" fill="url(#paper-skewed)" stroke="#1b1a18" stroke-width="2.5"/>
    <path d="M6 30c6-14 10 10 16-4s10-6 14 4 8 4 12-2" fill="none" stroke="#1b1a18" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g clip-path="url(#disc)">
    <rect x="110" y="0" width="80" height="80" fill="#e5e0d4"/>
    <g fill="#1b1a18" fill-opacity="0.3">
      <circle cx="130" cy="20" r="3"/><circle cx="142" cy="24" r="4"/><circle cx="156" cy="30" r="5"/>
      <circle cx="168" cy="44" r="5.5"/><circle cx="150" cy="52" r="4"/><circle cx="136" cy="56" r="2.5"/>
    </g>
  </g>
  <circle cx="150" cy="40" r="28" fill="none" stroke="#1b1a18" stroke-width="2"/>
  <ellipse cx="60" cy="105" rx="40" ry="16" fill="url(#glow)"/>
  <polyline points="10,140 30,120 50,135 70,118 90,132" fill="none" stroke="#45433e" stroke-width="3" stroke-linejoin="round" stroke-dasharray="none"/>
  <polygon points="110,140 130,104 150,140" fill="#b9aa8b" stroke="#1b1a18" stroke-width="2" stroke-linejoin="bevel"/>
  <g transform="matrix(1 0 0.35 1 -20 0)" opacity="0.8">
    <path d="M160 100 h20 v30 h-20 z M165 105 v20 h10 v-20 z" fill="#1b1a18" fill-rule="evenodd"/>
  </g>
  <path d="M100 70 a10 10 0 0110 10 A10 6 30 1 1 90 80 Q95 60 100 70 T120 64" fill="none" stroke="#5d5a53" stroke-width="1.5"/>
  <rect x="0" y="150" width="180" height="0" fill="#ff0000"/>
  <line x1="-10" y1="146" x2="190" y2="146" stroke="url(#user)" stroke-width="6"/>
  <g style="display:none"><rect width="200" height="160" fill="#ff0000"/></g>
</svg>
