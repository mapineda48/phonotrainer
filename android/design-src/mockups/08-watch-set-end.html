<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<title>Watch: the summary card at the end of today's set</title>
<link rel="stylesheet" href="kit/theme.css"><link rel="stylesheet" href="kit/feed.css">
<script src="kit/icons.js"></script><script src="kit/art.js"></script><script src="kit/kit.js"></script>
<style>
  .end { margin: 10px 14px 0; padding: 18px 16px 16px; }
  .end h1 { font-family: var(--font-display); font-weight: 650; font-size: 40px; line-height: 1.02; letter-spacing: -.02em; }
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .tally div { padding: 8px 4px; text-align: center; }
  .tally div + div { border-left: 1px solid var(--hairline); }
  .tally b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; }
  .tally span { font-size: 14px; color: var(--ink-2); }
  .met { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
</style></head>
<body>
<div class="phone grain fibres">
  <div data-statusbar></div>
  <div class="fhead">
    <span class="mode"><span data-icon="shuffle" data-size="20"></span>Mix <span class="k">· Today's set</span><span data-icon="chevron-down" data-size="18"></span></span>
    <span class="pos">Done<span class="beads" aria-hidden="true"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i></span></span>
  </div>
  <section class="card stack end" aria-label="Done for today">
    <span class="crop tl"></span><span class="crop tr"></span>
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="kicker">Today's set</div><h1 style="margin-top:6px">Done for<br>today</h1></div>
      <div data-art="setDone" data-opts='{"w":170,"h":110}' style="margin:-6px -10px 0 0"></div>
    </div>
    <div class="tally"><div><b>8</b><span>shorts</span></div><div><b>5</b><span>questions</span></div><div><b>4<span style="font-size:20px;font-style:italic;font-weight:400"> of </span>5</b><span>right</span></div></div>
    <h2 class="h2" style="margin-top:16px">What you met</h2>
    <div class="met">
      <span class="chip tall t-td"><span data-fam="td" data-size="16" data-plain></span>Flapping ×3</span>
      <span class="chip tall t-boundary"><span data-fam="boundary" data-size="16" data-plain></span>Linking ×2</span>
      <span class="chip tall t-boundary"><span data-fam="boundary" data-size="16" data-plain></span>h-dropping ×1</span>
      <span class="chip tall t-reduction"><span data-fam="reduction" data-size="16" data-plain></span>Vowel reduction ×1</span>
      <span class="chip tall t-assimilation"><span data-fam="assimilation" data-size="16" data-plain></span>Palatalization ×1</span>
    </div>
    <p class="lede" style="margin-top:12px">Nothing plays after this card. A new set is ready after midnight.</p>
    <span class="btn primary block lg" style="margin-top:12px"><span data-icon="house" data-size="20"></span>Back to Home</span>
    <div class="row gap10" style="margin-top:10px"><span class="btn grow"><span data-icon="shuffle" data-size="18"></span>Another set</span><span class="btn grow"><span data-icon="target" data-size="18"></span>Practice</span></div>
  </section>
  <div data-navbar="Watch"></div>
</div>
</body></html>
