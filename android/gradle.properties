# Gradle and Kotlin daemon heaps (architecture 2.4). Together with two Robolectric test forks of 1 GB they bound one
# copy of the project at about 6.5 GB while testing, which lets four copies build at once on the development computer.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
# Lint runs inside the Gradle daemon, and AGP lets floor(0.75 x heap / reserved) analyses run at once: four with the
# default 512 MB. Four K2 analyses beside R8, D8 and KSP exhaust the 3 GB heap, and lint then crashes on its own
# resolution ("Error while resolving FirRegularClassImpl from RAW_FIR to ..."). 1 GB each allows two (decision I-09).
android.experimental.lint.reservedMemoryPerTask=1g

org.gradle.caching=true
org.gradle.configuration-cache=true
# The modules are decoupled (architecture 2.2), so they may configure and build in parallel.
org.gradle.parallel=true

android.useAndroidX=true
# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle Managed Devices: the emulator's GPU mode. The committed default is the one architecture 2.4 and 22 record,
# swangle_indirect (software rendering, ANGLE over SwiftShader): the Linux computer the project started on crashed the
# emulator in the default headless modes and booted with it. The emulator deprecates the *_indirect modes since
# 36.4.9 (its -help-gpu lists auto, host, software, lavapipe, swiftshader and swangle). A computer that needs another
# mode sets it in its user ~/.gradle/gradle.properties, whose value wins over this file's (the Windows development
# computer sets gpu=host there); CI passes gpu=swiftshader_indirect on the command line (architecture 22).
android.testoptions.manageddevices.emulator.gpu=swangle_indirect
