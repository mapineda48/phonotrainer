# Gradle and Kotlin daemon heaps (architecture 2.4). Together with two Robolectric test forks of 1 GB they bound one
# copy of the project at about 6.5 GB while testing, which lets four copies build at once on the development computer.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
# Lint runs inside the Gradle daemon, and AGP lets floor(0.75 x heap / reserved) analyses run at once: four with the
# default 512 MB. Four K2 analyses beside R8, D8 and KSP exhaust the 3 GB heap, and lint then crashes on its own
# resolution ("Error while resolving FirRegularClassImpl from RAW_FIR to ..."). 1 GB each allows two (decision I-09).
android.experimental.lint.reservedMemoryPerTask=1g

org.gradle.caching=true
org.gradle.configuration-cache=true
# The modules are decoupled (architecture 2.2), so they may configure and build in parallel.
org.gradle.parallel=true

android.useAndroidX=true
# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle Managed Devices: software GPU rendering through ANGLE/SwiftShader. On the development computer the default
# headless modes crash the emulator and swangle_indirect boots; CI overrides it on the command line (architecture 22).
android.testoptions.manageddevices.emulator.gpu=swangle_indirect
