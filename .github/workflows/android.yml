# Android client: hygiene, build and instrumented tests (android/docs/architecture.md section 22).
# It never runs web tasks; the web paths below are the files the didactic drift check reads.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/src/didactic/**"
      - "web/src/features/learn/content.ts"
      - "web/src/features/learn/ipaLayout.ts"
      - "web/src/articulation/phones.ts"
      - "web/src/articulation/pose.ts"
      - "web/src/paths.ts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "web/src/didactic/**"
      - "web/src/features/learn/content.ts"
      - "web/src/features/learn/ipaLayout.ts"
      - "web/src/articulation/phones.ts"
      - "web/src/articulation/pose.ts"
      - "web/src/paths.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Least privilege: the jobs only read the repository. No secret is used; the release artifact is unsigned.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

# Every action is pinned to a full commit SHA (the comment names its release).
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hygiene check (the local hooks already ran it)
        run: python3 scripts/hygiene/check_repo.py

      - name: Tests of the scripts
        run: python3 -m unittest discover -s scripts

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  build:
    name: Unit tests, lint, builds and the didactic drift check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle runs on 21; compilation uses the 17 toolchain (architecture 2.4).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The drift check runs the extractor with Node's own TypeScript support (architecture 15.2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check, lint, debug and release builds, didactic drift check
        run: ./gradlew check lintDebug assembleDebug assembleRelease verifyDidacticContent

      - name: Merged release manifest against SECURITY.md
        run: python3 scripts/hygiene/check_repo.py --rules manifest --require-manifest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7

  instrumented:
    name: Instrumented and end-to-end tests (Gradle Managed Device)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The committed swangle_indirect is what the development computer needs; GitHub runners use SwiftShader.
      - name: Managed-device tests on a headless emulator
        run: >-
          ./gradlew pixel9Api36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports
          path: |
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
          retention-days: 7
